[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "ser-pipeline"
version = "1.0.0"
description = "Modular Speech Emotion Recognition pipeline for TESS, RAVDESS, SAVEE, CREMA-D"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "librosa>=0.10.0",
    "soundfile>=0.12.0",
    "scikit-learn>=1.3.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
]

[project.scripts]
ser-pipeline = "run:main"  # python -m ser_pipeline.main
